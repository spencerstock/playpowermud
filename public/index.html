<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Play Powermud in your browser: terminal, aliases, comms and a world map." />
    <title>Play Powermud</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/build/xterm.css" />
  </head>
  <body>
    <header>
      <h1>playpowermud</h1>
      <div class="connection-bar" aria-live="polite">
        <div class="conn-status">
          <span class="conn-pill conn-pill-muted" id="mud-status" data-kind="mud">Offline</span>
        </div>
        <div class="conn-controls">
          <button type="button" id="mud-connect" title="Connect to powermud.com">Connect</button>
          <button type="button" id="mud-disconnect" title="Close the MUD connection">Disconnect</button>
        </div>
      </div>
      <div class="controls">
        <button type="button" id="wiki-open" class="header-wiki-link" title="Powermud game wiki (Option+W)">Wiki</button>
        <a
          href="https://github.com/spencerstock/playpowermud"
          class="header-wiki-link"
          title="Client and wiki source (MIT license)"
          rel="noopener noreferrer"
        >Source</a>
        <button type="button" id="config-export" title="Download this session: aliases, comms, skin, and its map">Export config</button>
        <button type="button" id="config-import-btn" title="Add a session from a config file. It keeps its own map.">Import config</button>
        <input type="file" id="config-import" accept="application/json,.json" hidden />
        <button type="button" id="skin-cycle" title="Switch color theme (dark / light)">Skin: Dark</button>
        <div class="header-menu-wrap">
          <button
            type="button"
            id="app-menu-btn"
            class="app-menu-btn header-wiki-link"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="app-menu-panel"
            title="Client options (aliases, when rules, hotkeys, …)"
          >
            <span class="app-menu-icon" aria-hidden="true"></span>
            <span class="app-menu-label">Menu</span>
          </button>
          <div id="app-menu-panel" class="app-menu-panel" hidden role="menu" aria-labelledby="app-menu-btn">
            <label class="app-menu-field" data-keep-app-menu>
              Session
              <select id="session-select" data-keep-app-menu aria-label="Session"></select>
            </label>
            <button type="button" id="session-new" class="app-menu-action" role="menuitem" data-keep-app-menu>
              New session
            </button>
            <button type="button" id="session-rename" class="app-menu-action" role="menuitem" data-keep-app-menu>
              Rename session
            </button>
            <button type="button" id="session-delete" class="app-menu-action" role="menuitem" data-keep-app-menu>
              Delete session
            </button>
            <div class="app-menu-sep" role="separator"></div>
            <button type="button" id="map-export" class="app-menu-action" role="menuitem" data-keep-app-menu>
              Export map
            </button>
            <button type="button" id="map-import-btn" class="app-menu-action" role="menuitem" data-keep-app-menu>
              Import map
            </button>
            <input type="file" id="map-import" accept="application/json,.json" hidden />
            <div class="app-menu-sep" role="separator"></div>
            <button type="button" id="alias-menu-open" class="app-menu-action" role="menuitem" data-keep-app-menu>
              Aliases…
            </button>
            <button type="button" id="when-menu-open" class="app-menu-action" role="menuitem" data-keep-app-menu>
              When commands…
            </button>
            <button type="button" id="hotkey-menu-open" class="app-menu-action" role="menuitem" data-keep-app-menu>
              Hotkeys…
            </button>
          </div>
        </div>
      </div>
    </header>
    <div class="play-stack">
      <div class="play-main">
        <div id="log" class="mud-log-host" aria-label="MUD output"></div>
        <aside id="chat-panel-mount" aria-label="Comms"></aside>
      </div>
      <div id="map-panel-mount" aria-label="World map panel"></div>
    </div>
    <div id="mobile-commands" class="mobile-commands" aria-label="Game commands" hidden>
      <button type="button" class="mobile-command" data-quick-cmd="look">look</button>
      <button type="button" class="mobile-command" data-quick-cmd="who">who</button>
      <button type="button" class="mobile-command" data-quick-cmd="score">score</button>
    </div>
    <nav id="mobile-actions" class="mobile-actions" aria-label="Quick actions" hidden>
      <button type="button" class="mobile-action" id="mobile-map" title="World map (Option+M)">Map</button>
      <button type="button" class="mobile-action" id="mobile-comms" title="Comms (Option+C)">Comms</button>
      <button type="button" class="mobile-action mobile-action-add" id="mobile-add" title="Add a command button" aria-label="Add command button">+</button>
    </nav>
    <form id="form">
      <div class="command-wrap">
        <input
          id="input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          enterkeyhint="send"
          placeholder="Command  ·  /alias NAME EXPANSION  ·  /aliases  ·  /unalias NAME"
          aria-autocomplete="list"
          aria-controls="alias-ac"
          aria-expanded="false"
        />
        <ul id="alias-ac" class="alias-ac" role="listbox" hidden></ul>
      </div>
      <button type="submit">Send</button>
    </form>
    <div id="wire-hint" class="wire-hint" aria-live="polite"></div>
    <script type="module" src="/build/app.js"></script>
  </body>
</html>
